name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version, so one failure does not hide the other's result.
      fail-fast: false
      matrix:
        # The lowest supported version and the current long-term support version.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Build generated files
        run: npm run build
      - name: Generated files are committed and up to date
        # git add -N makes new, never-committed files visible to git diff, so a generated file
        # that was left out of the commit fails here too.
        run: |
          git add -N gmail/Core.gs gmail/appsscript.json docs
          git status --short -- gmail/Core.gs gmail/appsscript.json docs
          git diff --exit-code -- gmail/Core.gs gmail/appsscript.json docs
      - name: Run checks
        run: npm run check

  # The headless Chrome scenario, run separately so a problem there is visible but does not
  # block the main check. Failures appear as annotations on the run's page.
  browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Chrome version
        run: google-chrome --version || true
      - name: Browser scenario
        env:
          VERLASS_UI: "1"
        run: node scripts/check.mjs --only=ui
